name: Street Story Live E2E

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'full_social = complete Android publication; more = independent fact accumulation; identity/readback = focused checks'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full_social
          - more
          - identity
          - readback
      keep_publication:
        description: 'Owner-visible test: retain one test-group post instead of testing cancellation (full_social only)'
        required: false
        default: false
        type: boolean
      story_id:
        description: 'readback: export only; identity/full_social/more: inspect or continue saved story (not a fresh full pass)'
        required: false
        type: string
      photo_url:
        description: 'Approved public SOURCE URL; identity angle tests only unless explicitly approved for a saved story'
        required: false
        type: string
      resume_identity_research:
        description: 'identity + saved story only: explicit scoped Resume of stopped research'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: street-story-live-e2e-${{ inputs.acceptance == 'readback' && 'readback' || 'live' }}
  cancel-in-progress: false

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'readback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export one existing test result without publication writes
        env:
          READBACK_STORY_ID: ${{ inputs.story_id }}
          STREET_STORY_LIVE_TOKEN: ${{ secrets.STREET_STORY_LIVE_TOKEN }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, re, shutil, urllib.request
          story_id = os.environ['READBACK_STORY_ID']
          if not re.fullmatch(r'story_[a-zA-Z0-9]{8,64}', story_id):
              raise SystemExit('invalid test story id')
          base = 'https://street-story.kenigevents.ru'
          token = os.environ['STREET_STORY_LIVE_TOKEN']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def fetch(path, limit):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + token})
              with opener.open(req, timeout=30) as response:
                  data = response.read(limit + 1)
                  if len(data) > limit:
                      raise RuntimeError('result exceeds export bound')
                  return data
          story = json.loads(fetch('/v1/stories/' + story_id, 2_000_000))
          publication = story.get('publication') or {}
          # Permit inspection before publication for an owner canary on a test-only backend.
          aliases = [str(item.get('alias') or '') for item in story.get('destinations', [])]
          caps = json.loads(fetch('/v1/capabilities', 100_000))
          canary_preview = (
              not publication and not aliases
              and str(story.get('client_story_id') or '').startswith('live-product-')
              and story.get('place_name') == 'Закхаймские ворота'
              and [item.get('alias') for item in caps.get('destinations', [])] == ['street_story_e2e_20260928_tg'])
          if not canary_preview and (not aliases or not all(alias.startswith('street_story_e2e_') for alias in aliases)):
              raise SystemExit('test publication binding missing')
          visual = story.get('visual') or {}
          out = pathlib.Path('backend/live-e2e-artifacts')
          out.mkdir(parents=True, exist_ok=True)
          keys = ('id', 'state', 'place_name', 'draft_text', 'source_count', 'sources', 'facts', 'publication')
          receipt = {key: story.get(key) for key in keys}
          receipt['image_url'] = story.get('processed_image_url')
          receipt['visual'] = {key: visual.get(key) for key in ('prompt_version', 'content_revision', 'operation_id', 'selected_asset_ref')}
          receipt['read_only'] = True
          receipt['secrets_disclosed'] = False
          (out / 'owner-readback.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({'story_id': story_id, 'state': story.get('state'), 'image_url': story.get('processed_image_url'), 'visual_operation_id': visual.get('operation_id')}))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: street-story-owner-readback-${{ github.run_id }}
          path: backend/live-e2e-artifacts/
          retention-days: 14
  live-e2e:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.acceptance != 'readback') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       (github.event.label.name == 'live-e2e-smoke' || github.event.label.name == 'live-e2e-full-social') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify deployed backend checkout
        working-directory: backend
        env:
          STREET_STORY_LIVE_BASE_URL: https://street-story.kenigevents.ru
          STREET_STORY_EXPECTED_BACKEND_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request

          base = os.environ.get('STREET_STORY_LIVE_BASE_URL', '').strip().rstrip('/')
          expected = os.environ.get('STREET_STORY_EXPECTED_BACKEND_SHA', '').strip().lower()
          out = pathlib.Path('live-e2e-artifacts/deployment.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          actual = None
          status = 'failed'
          failure = None
          try:
              if not base.startswith('https://'):
                  raise RuntimeError('live_base_url_not_https')
              if not re.fullmatch(r'[0-9a-f]{40}', expected):
                  raise RuntimeError('expected_backend_sha_invalid')
              request = urllib.request.Request(
                  base + '/healthz',
                  headers={'Accept': 'application/json', 'User-Agent': 'StreetStory-Live-E2E/4'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.load(response)
              actual = str(body.get('source_sha') or '').strip().lower() or None
              if actual != expected:
                  failure = 'deployed_backend_sha_mismatch'
                  raise RuntimeError(failure)
              status = 'ok'
          except Exception as exc:
              failure = failure or str(exc)[:120]
          payload = {
              'schema_version': 1,
              'status': status,
              'expected_source_sha': expected or None,
              'deployed_source_sha': actual,
              'failure_code': failure,
          }
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          if status != 'ok':
              raise SystemExit(
                  f"Street Story deployment preflight failed: {failure}; "
                  f"expected={expected or '<missing>'}; deployed={actual or '<missing>'}"
              )
          print(f'Street Story deployed backend SHA verified: {actual}')
          PY

      - name: Install live media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak ffmpeg

      - name: Install live client dependency
        working-directory: backend
        run: python -m pip install 'httpx>=0.27,<1'

      - name: Run backend/provider smoke through HTTPS
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.acceptance == 'smoke') ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-smoke')
        working-directory: backend
        env:
          STREET_STORY_LIVE_BASE_URL: https://street-story.kenigevents.ru
          STREET_STORY_LIVE_TOKEN: ${{ secrets.STREET_STORY_LIVE_TOKEN }}
          SAFE_TEST_DESTINATION_ALIAS: street_story_e2e_20260928_tg
          LIVE_E2E_MODE: smoke
          STREET_STORY_LIVE_DIAGNOSTIC: live-e2e-artifacts/diagnostic.json
        run: python tools/live_e2e.py

      - uses: actions/setup-java@v4
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')

      - uses: gradle/actions/setup-gradle@v4
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        with:
          gradle-version: '8.13'

      - name: Restore canonical signing key for live emulator APKs
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.STREET_STORY_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STREET_STORY_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64"
          test -n "$SIGNING_STORE_PASSWORD"
          install -d -m 0700 "$RUNNER_TEMP/street-story-signing"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/street-story-signing/owner-signing.p12"
          chmod 0600 "$RUNNER_TEMP/street-story-signing/owner-signing.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/street-story-signing/owner-signing.p12" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias streetstory >/dev/null

      - name: Build exact-HEAD Android test APKs
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        env:
          STREET_STORY_SIGNING_STORE_FILE: ${{ runner.temp }}/street-story-signing/owner-signing.p12
          STREET_STORY_SIGNING_STORE_PASSWORD: ${{ secrets.STREET_STORY_SIGNING_STORE_PASSWORD }}
          STREET_STORY_SOURCE_SHA: ${{ github.sha }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Prepare licensed photo and prepared-audio fixtures
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        env:
          STREET_STORY_LIVE_BASE_URL: https://street-story.kenigevents.ru
          STREET_STORY_LIVE_TOKEN: ${{ secrets.STREET_STORY_LIVE_TOKEN }}
          SAFE_TEST_DESTINATION_ALIAS: street_story_e2e_20260928_tg
          LIVE_E2E_IDENTITY_ONLY: ${{ inputs.acceptance == 'identity' && 'true' || 'false' }}
          LIVE_E2E_SOURCE_URL: ${{ inputs.photo_url }}
          LIVE_E2E_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$STREET_STORY_LIVE_BASE_URL"
          test -n "$STREET_STORY_LIVE_TOKEN"
          test -n "$SAFE_TEST_DESTINATION_ALIAS"
          rm -rf live-android-fixtures
          mkdir -p live-android-fixtures backend/live-e2e-artifacts
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          root = pathlib.Path('live-android-fixtures')
          fixture = pathlib.Path('backend/tools/fixtures/zachheim-owner-20260928')
          meta = json.loads((fixture / 'fixture.json').read_text(encoding='utf-8'))
          source_url = os.environ.get('LIVE_E2E_SOURCE_URL') or (
              'https://raw.githubusercontent.com/onedayonemasterpiece/street-story/' +
              os.environ['LIVE_E2E_SOURCE_SHA'] + '/backend/tools/fixtures/zachheim-owner-20260928/' + meta['source_file'])
          if not source_url.startswith('https://'):
              raise SystemExit('SOURCE must use an approved public HTTPS URL')
          (root / 'config.json').write_text(
              json.dumps({
                  'backend_url': os.environ['STREET_STORY_LIVE_BASE_URL'].rstrip('/'),
                  'safe_alias': os.environ['SAFE_TEST_DESTINATION_ALIAS'],
                  'photo_url': source_url,
                  'latitude': meta['latitude'], 'longitude': meta['longitude'],
              }),
              encoding='utf-8',
          )
          (root / 'token.txt').write_text(os.environ['STREET_STORY_LIVE_TOKEN'], encoding='utf-8')
          texts = [
              'Я хочу сделать городской пост об этой фотографии. Помоги узнать, что за здание на ней.',
              'Рассмотри фотографию и помоги определить здание. Я не знаю его названия.',
              'Теперь найди проверяемые исторические факты об этом здании.',
              'Оставь два самых надежных подтвержденных факта, остальные не используй в текущем посте.',
              'Сделай текст короче и живее, без канцелярита. Факты сохрани.',
              'Сделай картинку чуть теплее, а текст оставь без изменений.',
          ]
          for ordinal, speech in enumerate(texts if os.environ.get('LIVE_E2E_IDENTITY_ONLY') != 'true' else [], 1):
              wav = root / f'voice-{ordinal}.wav'
              pcm = root / f'voice-{ordinal}.pcm'
              subprocess.run(['espeak', '-v', 'ru', '-s', '165', '-w', str(wav), speech], check=True)
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', str(wav),
                  '-ar', '16000', '-ac', '1', '-f', 's16le', '-acodec', 'pcm_s16le', str(pcm),
              ], check=True)
              wav.unlink()
          PY
          python - <<'PY'
          import json, os, pathlib
          meta = json.loads(pathlib.Path('backend/tools/fixtures/zachheim-owner-20260928/fixture.json').read_text(encoding='utf-8'))
          public = {
              'schema_version': 1,
              'fixture_id': meta['fixture_id'],
              'source': 'owner-supplied repository fixture',
              'object': meta['expected_object'],
              'license': meta['license'],
              'photo_input_mode': 'public_url_raw_ram',
              'photo_url': json.loads(pathlib.Path('live-android-fixtures/config.json').read_text())['photo_url'],
              'photo_coordinates_source': 'owner_fixture_metadata',
              'photo_pixel_transforms': False,
              'photo_disk_copies': False,
              'latitude': meta['latitude'],
              'longitude': meta['longitude'],
              'prepared_audio': os.environ.get('LIVE_E2E_IDENTITY_ONLY') != 'true',
              'physical_mic': False,
          }
          pathlib.Path('backend/live-e2e-artifacts/android-fixture-provenance.json').write_text(
              json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Enable KVM for Android live E2E
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Android client -> live backend -> native Telegram golden run
        env:
          LIVE_E2E_KEEP_PUBLICATION: ${{ inputs.keep_publication && 'true' || 'false' }}
          LIVE_E2E_MORE_ONLY: ${{ inputs.acceptance == 'more' && 'true' || 'false' }}
          LIVE_E2E_RESUME_STORY_ID: ${{ inputs.story_id }}
          LIVE_E2E_RESUME_IDENTITY_RESEARCH: ${{ inputs.resume_identity_research && 'true' || 'false' }}
          LIVE_E2E_IDENTITY_ONLY: ${{ inputs.acceptance == 'identity' && 'true' || 'false' }}
        if: >-
          (github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'full_social' || inputs.acceptance == 'more' || inputs.acceptance == 'identity')) ||
          (github.event_name == 'pull_request' && github.event.label.name == 'live-e2e-full-social')
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -timezone Etc/UTC -dns-server 8.8.8.8,1.1.1.1
          disable-animations: true
          script: bash .github/scripts/live-e2e-android.sh

      - name: Upload redacted live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-story-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/live-e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
