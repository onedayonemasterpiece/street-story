name: Street Story Live E2E

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: 'smoke accepts the known visual ingress blocker; full_social requires complete visual + safe social cleanup'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full_social
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/live-e2e.yml'
      - 'backend/tools/live_e2e.py'

permissions:
  contents: read

concurrency:
  group: street-story-live-e2e
  cancel-in-progress: false

jobs:
  live-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install live media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak ffmpeg

      - name: Install live client dependency
        working-directory: backend
        run: python -m pip install 'httpx>=0.27,<1'

      - name: Run Street Story live E2E through HTTPS
        working-directory: backend
        env:
          STREET_STORY_LIVE_BASE_URL: ${{ secrets.STREET_STORY_LIVE_BASE_URL }}
          STREET_STORY_LIVE_TOKEN: ${{ secrets.STREET_STORY_LIVE_TOKEN }}
          SAFE_TEST_DESTINATION_ALIAS: ${{ secrets.SAFE_TEST_DESTINATION_ALIAS }}
          LIVE_E2E_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance || 'smoke' }}
          STREET_STORY_LIVE_DIAGNOSTIC: live-e2e-artifacts/diagnostic.json
        run: python tools/live_e2e.py

      - name: Upload redacted live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: street-story-live-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/live-e2e-artifacts/diagnostic.json
          if-no-files-found: warn
          retention-days: 14
