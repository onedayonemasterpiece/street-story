name: Street Story Backend
on:
  push:
    branches: [main, work/street-story-mvp-20260908]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: street-story-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check street_story tests
      - name: Pytest
        run: python -m pytest -q tests
