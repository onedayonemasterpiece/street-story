name: temp-download-y6gekdenuwo

on:
  push:
    branches:
      - tmp/download-y6gekdenuwo-20260924
    paths:
      - .github/workflows/tmp-download-y6gekdenuwo.yml

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -q yt-dlp

      - name: Download exact YouTube video as MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://www.youtube.com/watch?v=Y6gEkdENuWo'
          python -m yt_dlp             --no-playlist             --format 'bv*[height<=720][vcodec^=avc1]+ba[acodec^=mp4a]/bv*[height<=720]+ba/b[height<=720]'             --merge-output-format mp4             --remux-video mp4             --output 'out/Y6gEkdENuWo_lecture.%(ext)s'             "$URL"
          FILE="$(find out -maxdepth 1 -type f -name 'Y6gEkdENuWo_lecture*.mp4' -print -quit)"
          test -n "$FILE"
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=index,codec_name,codec_type,width,height             -of json "$FILE" > out/info.json
          cat out/info.json

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: Y6gEkdENuWo_lecture_video
          path: out/Y6gEkdENuWo_lecture.mp4
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload info
        uses: actions/upload-artifact@v4
        with:
          name: Y6gEkdENuWo_lecture_info
          path: out/info.json
          retention-days: 1
          if-no-files-found: error
