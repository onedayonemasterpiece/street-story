name: Street Story public host probe

on:
  push:
    branches:
      - work/street-story-mvp-20260908
    paths:
      - .deploy/devcoveer-seal-request.json

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STREET_STORY_LIVE_BASE_URL: ${{ secrets.STREET_STORY_LIVE_BASE_URL }}
    steps:
      - name: Print public hostname only
        shell: python
        run: |
          import os
          from urllib.parse import urlparse
          value = os.environ.get("STREET_STORY_LIVE_BASE_URL", "")
          parsed = urlparse(value)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("invalid or missing HTTPS live base URL")
          print("PUBLIC_STREET_STORY_HOST=" + parsed.hostname)
